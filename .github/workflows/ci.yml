name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-agent:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22.x'
        cache-dependency-path: execute-node-agent/go.sum
    - name: Build Node Agent
      working-directory: ./execute-node-agent
      run: |
        go build -o execute-node-agent.exe ./cmd/agent/main.go
    - name: Run Tests
      working-directory: ./execute-node-agent
      run: go test ./...

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
    - name: Install & Build
      working-directory: ./saas-portal/frontend
      run: |
        npm ci
        npm run build
